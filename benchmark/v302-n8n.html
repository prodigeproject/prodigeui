<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVABLE FLOW (ProdigeUI v3.0.2 — Semantic Tokens &amp; WCAG AA)</title>
  <style>
    /* PRODIGEUI v3.0.2 — Semantic tokens & WCAG AA contrast gates (4.5:1), kaku 3-column layout */
    :root {
      --prodigeui-color-bg: #0f172a;
      --prodigeui-color-surface: #1e293b;
      --prodigeui-color-text: #f8fafc;
      --prodigeui-color-muted: #94a3b8;
      --prodigeui-color-primary: #10b981;
      --prodigeui-color-border: #334155;
    }
    body { font-family: Inter, system-ui, sans-serif; background: var(--prodigeui-color-bg); color: var(--prodigeui-color-text); margin: 0; }
    .nav { padding: 1rem 2rem; background: var(--prodigeui-color-surface); border-bottom: 1px solid var(--prodigeui-color-border); display: flex; justify-content: space-between; }
    .hero { padding: 5rem 2rem; text-align: center; max-width: 900px; margin: 0 auto; }
    .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
    .card { background: var(--prodigeui-color-surface); border: 1px solid var(--prodigeui-color-border); padding: 1.5rem; border-radius: 8px; text-align: left; }
  </style>
</head>
<body>
  <div class="nav">
    <div style="font-weight: 700; color: var(--prodigeui-color-primary);">Lovable Flow v3.0.2</div>
  </div>
  <div class="hero">
    <h1>Prompt to Full-Stack App Builder</h1>
    <p style="color: var(--prodigeui-color-muted);">Convert natural language prompts into React WebGL apps and n8n workflow DAGs.</p>
    <a href="#" style="background: var(--prodigeui-color-primary); color: #000; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 700; display: inline-block; margin-top: 1rem;">Launch Engine</a>
    
    <div class="grid-3">
      <div class="card">
        <h3 style="color: var(--prodigeui-color-primary); margin-top: 0;">Bi-directional Sync</h3>
        <p style="color: var(--prodigeui-color-muted); font-size: 0.9rem;">Visual nodes &amp; raw code sync.</p>
      </div>
      <div class="card">
        <h3 style="color: var(--prodigeui-color-primary); margin-top: 0;">WebGL 3D Engine</h3>
        <p style="color: var(--prodigeui-color-muted); font-size: 0.9rem;">Three.js shader integration.</p>
      </div>
      <div class="card">
        <h3 style="color: var(--prodigeui-color-primary); margin-top: 0;">Edge Deploy</h3>
        <p style="color: var(--prodigeui-color-muted); font-size: 0.9rem;">Instant WebAssembly edge runtimes.</p>
      </div>
    </div>
  </div>
</body>
</html>
