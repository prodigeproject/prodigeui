<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToonHub – 3D Figurines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0ms !important; }
    }
    *:focus-visible { outline: 2px solid white; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const IMAGES = [
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/1.02464a56.png', bg: '#F4845F', panel: '#F79B7F' },
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/2.b977faab.png', bg: '#6BBF7A', panel: '#85CC92' },
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/3.4df853b4.png', bg: '#E882B4', panel: '#ED9DC4' },
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/4.4457fbce.png', bg: '#6EB5FF', panel: '#8DC4FF' },
    ];

    function App() {
      const [activeIndex, setActiveIndex] = useState(0);
      const [isMobile, setIsMobile] = useState(window.innerWidth < 640);
      const isAnimating = useRef(false);
      const timeoutRef = useRef(null);
      const touchStartX = useRef(null);

      useEffect(() => {
        IMAGES.forEach(({ src }) => { const img = new Image(); img.src = src; });
      }, []);

      useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth < 640);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      useEffect(() => {
        return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
      }, []);

      const navigate = useCallback((dir) => {
        if (isAnimating.current) return;
        isAnimating.current = true;
        setActiveIndex((prev) => dir === 'next' ? (prev + 1) % 4 : (prev + 3) % 4);
        timeoutRef.current = setTimeout(() => { isAnimating.current = false; }, 650);
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowLeft') navigate('prev');
          else if (e.key === 'ArrowRight') navigate('next');
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [navigate]);

      const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const onTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const diff = e.changedTouches[0].clientX - touchStartX.current;
        if (Math.abs(diff) > 50) navigate(diff < 0 ? 'next' : 'prev');
        touchStartX.current = null;
      };

      const getRole = (i) => {
        if (i === activeIndex) return 'center';
        if (i === (activeIndex + 1) % 4) return 'right';
        if (i === (activeIndex + 3) % 4) return 'left';
        return 'back';
      };

      const getStyle = (role) => {
        const base = { position: 'absolute', aspectRatio: '0.6/1', transition: 'all 650ms cubic-bezier(0.4,0,0.2,1)' };
        if (role === 'center') return { ...base, left: '50%', transform: `translateX(-50%) scale(${isMobile ? 1.25 : 1.68})`, filter: 'none', opacity: 1, zIndex: 20, height: isMobile ? '60%' : '92%', bottom: isMobile ? '22%' : '0' };
        if (role === 'left') return { ...base, left: isMobile ? '20%' : '30%', transform: 'translateX(-50%) scale(1)', filter: 'blur(2px)', opacity: 0.85, zIndex: 10, height: isMobile ? '16%' : '28%', bottom: isMobile ? '32%' : '12%' };
        if (role === 'right') return { ...base, left: isMobile ? '80%' : '70%', transform: 'translateX(-50%) scale(1)', filter: 'blur(2px)', opacity: 0.85, zIndex: 10, height: isMobile ? '16%' : '28%', bottom: isMobile ? '32%' : '12%' };
        return { ...base, left: '50%', transform: 'translateX(-50%) scale(1)', filter: 'blur(4px)', opacity: 1, zIndex: 5, height: isMobile ? '13%' : '22%', bottom: isMobile ? '32%' : '12%' };
      };

      const ArrowLeft = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      );
      const ArrowRight = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      );
      const ArrowRightSmall = ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      );

      return (
        <div
          style={{ width: '100vw', height: '100vh', backgroundColor: IMAGES[activeIndex].bg, transition: 'background-color 650ms', position: 'relative', overflow: 'hidden' }}
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
        >
          {/* Grain overlay */}
          <div style={{ position: 'absolute', inset: 0, opacity: 0.4, pointerEvents: 'none', zIndex: 50, backgroundSize: '200px' }}>
            <svg width="100%" height="100%" style={{ opacity: 0.08 }}>
              <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" /></filter>
              <rect width="100%" height="100%" filter="url(#grain)" />
            </svg>
          </div>

          {/* Ghost text */}
          <div style={{ position: 'absolute', top: '18%', left: '50%', transform: 'translateX(-50%)', fontFamily: 'Anton, sans-serif', fontSize: 'clamp(90px, 28vw, 380px)', fontWeight: 900, color: 'white', opacity: 1, textTransform: 'uppercase', letterSpacing: '-0.02em', whiteSpace: 'nowrap', pointerEvents: 'none', zIndex: 1 }}>3D SHAPE</div>

          {/* Brand label */}
          <header className="absolute top-6 left-4 sm:left-8" style={{ zIndex: 60 }}>
            <span className="text-xs font-semibold uppercase text-white" style={{ opacity: 0.9, letterSpacing: '0.18em' }}>TOONHUB</span>
          </header>

          {/* Carousel */}
          <div role="region" aria-roledescription="carousel" aria-label="TOONHUB character figurine carousel" style={{ position: 'absolute', inset: 0, zIndex: 10 }}>
            {IMAGES.map((item, i) => (
              <div key={i} style={getStyle(getRole(i))}>
                <img src={item.src} alt={`Figurine ${i + 1}`} style={{ width: '100%', height: '100%', objectFit: 'contain', objectPosition: 'bottom center' }} draggable="false" />
              </div>
            ))}
          </div>

          {/* Bottom-left info */}
          <div className="absolute bottom-6 left-4 sm:bottom-20 sm:left-24" style={{ zIndex: 60, maxWidth: 320 }}>
            <h2 className="font-bold uppercase tracking-widest mb-2 sm:mb-3 text-base sm:text-[22px] text-white" style={{ opacity: 0.95 }}>TOONHUB FIGURINES</h2>
            <p className="hidden sm:block text-xs sm:text-sm text-white mb-4 sm:mb-5" style={{ opacity: 0.85, lineHeight: 1.6 }}>The artwork is stunning, shipped fully prepared. The finish is a vision, the 3D craft is flawless. Many thanks! Wishing you the win. Order now.</p>
            <nav className="flex gap-3 sm:gap-4" aria-label="Carousel navigation">
              <button
                onClick={() => navigate('prev')}
                aria-label="Previous character"
                className="w-12 h-12 sm:w-16 sm:h-16 rounded-full flex items-center justify-center text-white hover:scale-[1.08]"
                style={{ background: 'transparent', border: '2px solid white', transition: 'all 200ms' }}
                onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}
                onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
              ><ArrowLeft /></button>
              <button
                onClick={() => navigate('next')}
                aria-label="Next character"
                className="w-12 h-12 sm:w-16 sm:h-16 rounded-full flex items-center justify-center text-white hover:scale-[1.08]"
                style={{ background: 'transparent', border: '2px solid white', transition: 'all 200ms' }}
                onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}
                onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
              ><ArrowRight /></button>
            </nav>
          </div>

          {/* Bottom-right discover link */}
          <div className="absolute bottom-6 right-4 sm:bottom-20 sm:right-10 flex items-center gap-2" style={{ zIndex: 60 }}>
            <a href="#" className="uppercase text-white flex items-center gap-2" style={{ fontFamily: 'Anton, sans-serif', fontSize: 'clamp(20px, 4vw, 56px)', fontWeight: 400, opacity: 0.95, letterSpacing: '-0.02em', textDecoration: 'none', transition: 'opacity 200ms' }}
              onMouseEnter={(e) => e.currentTarget.style.opacity = '1'}
              onMouseLeave={(e) => e.currentTarget.style.opacity = '0.95'}
            >DISCOVER IT<ArrowRightSmall className="w-5 h-5 sm:w-8 sm:h-8" /></a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
