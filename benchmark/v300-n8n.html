<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVABLE FLOW (ProdigeUI v3.0.0 — Raw Baseline)</title>
  <style>
    /* PRODIGEUI v3.0.0 — Raw unconstrained LLM output, no token boundaries, flat boxes, inline styles, low contrast */
    body { font-family: Arial, sans-serif; background-color: #1a202c; color: #718096; margin: 0; padding: 0; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #2d3748; }
    .logo { font-size: 20px; font-weight: bold; color: #319795; }
    .hero { text-align: center; padding: 60px 20px; }
    .hero h1 { font-size: 40px; color: #edf2f7; }
    .btn { background: #319795; color: #fff; padding: 10px 20px; border-radius: 4px; text-decoration: none; }
    .box { background: #2d3748; border: 1px solid #4a5568; padding: 20px; margin: 30px auto; max-width: 700px; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="logo">Lovable Flow v3.0.0</div>
  </div>
  <div class="hero">
    <h1>Prompt to App Builder</h1>
    <p style="color: #718096;">Build apps with LLM prompts.</p>
    <a href="#" class="btn" style="background: #319795; color: #fff;">Build Now</a>
    <div class="box" style="background: #2d3748; color: #a0aec0;">
      <p>// Static Code Representation</p>
    </div>
  </div>
</body>
</html>
